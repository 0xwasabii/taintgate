[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taintgate"
version = "0.1.0"
description = "Provenance-aware (taint tracking) firewall for coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
taintgate = "taintgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taintgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
